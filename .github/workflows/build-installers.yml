name: Build & Release Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a gerar (ex: 0.5.0). Vazio = usa a versão atual dos arquivos.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
        shell: bash
        run: |
          if [ -n "$VERSION" ]; then
            node scripts/version-bump.mjs "$VERSION"
          fi
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev \
            librsvg2-dev libasound2-dev libv4l-dev \
            libgtk-3-dev patchelf xdg-utils
          (sudo apt-get install -y libayatana-appindicator3-dev) || sudo apt-get install -y libappindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env (Unsplash)
        env:
          VITE_UNSPLASH_CLIENT_ID: ${{ secrets.VITE_UNSPLASH_CLIENT_ID }}
        shell: bash
        run: |
          if [ -n "$VITE_UNSPLASH_CLIENT_ID" ]; then
            echo "VITE_UNSPLASH_CLIENT_ID=$VITE_UNSPLASH_CLIENT_ID" > .env
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: Commit bumped version back
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && github.repository_default_branch || github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Sem mudanças de versão para commitar."
          else
            git commit -m "chore: bump version to $VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi